<style>
  :root{
    --bg:#0f0f10; --surface:#18181b; --text:#f4f4f5; --muted:#a1a1aa;
    --accent:#d4a24c; --accent-text:#111; --line:rgba(255,255,255,.08);
    --radius:14px; --font-head:Georgia,serif; --font-body:system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  h1,h2,h3{font-family:var(--font-head);line-height:1.15;font-weight:var(--head-weight,700)}
  h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:.4em}
  .eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;font-weight:700;margin-bottom:.6em;display:block}
  .lead{color:var(--muted);max-width:620px}
  section{padding:88px 0}
  .btn{display:inline-flex;align-items:center;gap:.6em;background:var(--accent);color:var(--accent-text);text-decoration:none;font-weight:700;padding:15px 26px;border-radius:999px;transition:transform .15s,box-shadow .15s;border:0;cursor:pointer;font-size:1rem}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px -10px var(--accent)}
  .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
  .btn svg{width:20px;height:20px}

  /* header */
  header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .25s,backdrop-filter .25s}
  header.solid{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:70px}
  .logo{font-family:var(--font-head);font-size:1.35rem;font-weight:var(--head-weight,700);text-decoration:none;color:#fff}
  header.solid .logo{color:var(--text)}
  .logo span{color:var(--accent)}
  .nav ul{display:flex;gap:28px;list-style:none}
  .nav ul a{text-decoration:none;color:#fff;opacity:.85;font-size:.95rem}
  header.solid .nav ul a{color:var(--text)}
  .nav ul a:hover{opacity:1;color:var(--accent)}
  @media(max-width:820px){.nav ul{display:none}}

  /* hero */
  .hero{min-height:100svh;display:flex;align-items:center;position:relative;padding:120px 0 80px;color:#fff;background:#000 center/cover no-repeat}
  .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.25) 100%)}
  .hero .wrap{position:relative;width:100%}
  .hero h1{font-size:clamp(2.4rem,6.5vw,4.6rem);max-width:780px;margin-bottom:.35em}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero p{font-size:clamp(1.05rem,2vw,1.25rem);max-width:560px;opacity:.9;margin-bottom:2em}
  .hero .ctas{display:flex;gap:14px;flex-wrap:wrap}
  .hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
  .badges{display:flex;gap:26px;flex-wrap:wrap;margin-top:48px;font-size:.92rem;opacity:.9}
  .badges b{display:block;font-size:1.6rem;font-family:var(--font-head);color:var(--accent)}

  /* features */
  .grid{display:grid;gap:20px}
  .features .grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:40px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
  .card .ico{font-size:1.8rem;margin-bottom:14px;width:52px;height:52px;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .card h3{font-size:1.2rem;margin-bottom:.4em}
  .card p{color:var(--muted);font-size:.96rem}

  /* services / menu */
  .services{background:var(--surface)}
  .svc-cats{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0 26px}
  .svc-cats button{background:transparent;border:1.5px solid var(--line);color:var(--text);padding:9px 18px;border-radius:999px;cursor:pointer;font:inherit;font-size:.92rem}
  .svc-cats button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .svc-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px 40px}
  @media(max-width:420px){.svc-list{grid-template-columns:1fr}}
  .svc{display:flex;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px dashed var(--line)}
  .svc .n{font-weight:600}
  .svc .d{color:var(--muted);font-size:.9rem}
  .svc .dots{flex:1}
  .svc .p{font-family:var(--font-head);color:var(--accent);font-weight:700;white-space:nowrap;font-size:1.1rem}
  .svc-note{margin-top:28px;color:var(--muted);font-size:.9rem}

  /* gallery */
  .gallery .grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:220px;margin-top:40px}
  .gallery figure{overflow:hidden;border-radius:var(--radius);background:var(--surface)}
  .gallery figure:nth-child(1){grid-column:span 2;grid-row:span 2}
  .gallery img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .gallery figure:hover img{transform:scale(1.06)}
  @media(max-width:720px){.gallery .grid{grid-template-columns:1fr 1fr;grid-auto-rows:160px}}

  /* reviews */
  .reviews{background:var(--surface)}
  .reviews .grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:40px}
  .stars{color:#f5b301;letter-spacing:2px;margin-bottom:10px}
  .review p{font-size:1rem;margin-bottom:16px}
  .review .who{display:flex;align-items:center;gap:12px;font-weight:600;font-size:.95rem}
  .review .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-text);font-weight:700}
  .review .who small{display:block;color:var(--muted);font-weight:400}
  .gscore{display:inline-flex;align-items:center;gap:10px;margin-top:6px;color:var(--muted);font-size:.95rem}
  .gscore b{color:var(--text);font-size:1.3rem}

  /* contact */
  .contact .grid{grid-template-columns:1fr 1fr;gap:40px;align-items:stretch}
  @media(max-width:820px){.contact .grid{grid-template-columns:1fr}}
  .info{display:flex;flex-direction:column;gap:22px}
  .info-row{display:flex;gap:14px}
  .info-row .ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);font-size:1.2rem}
  .info-row h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
  .hours{width:100%;border-collapse:collapse;font-size:.95rem}
  .hours td{padding:4px 0}
  .hours td:last-child{text-align:right;color:var(--muted)}
  .map{border-radius:var(--radius);overflow:hidden;min-height:360px;border:1px solid var(--line)}
  .map iframe{width:100%;height:100%;min-height:360px;border:0;filter:grayscale(.2)}

  /* cta band */
  .band{padding:72px 0;text-align:center;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000));color:var(--accent-text)}
  .band h2{margin-bottom:.3em}
  .band p{opacity:.85;margin-bottom:1.6em}
  .band .btn{background:var(--accent-text);color:var(--accent)}

  footer{padding:36px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer a{text-decoration:none}

  .wa-float{position:fixed;right:20px;bottom:20px;z-index:60;width:60px;height:60px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 10px 30px -6px rgba(37,211,102,.6);animation:pulse 2.4s infinite}
  .wa-float svg{width:32px;height:32px;fill:#fff}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}50%{box-shadow:0 0 0 14px rgba(37,211,102,0)}}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}.wa-float{animation:none}}
</style>
</head>

<script>
(function(){
  const C = SITE;
  const $ = (s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const get = (o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
  const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // tema
  const r = document.documentElement.style;
  Object.entries(C.theme.colors).forEach(([k,v])=>r.setProperty('--'+k,v));
  r.setProperty('--font-head', `'${C.theme.fontHead}', Georgia, serif`);
  r.setProperty('--font-body', `'${C.theme.fontBody}', system-ui, sans-serif`);
  $('#gfont').href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(C.theme.fontHead)}:wght@${C.theme.headWeights||'600;700'}&family=${encodeURIComponent(C.theme.fontBody)}:wght@400;500;600;700&display=swap`;

  r.setProperty('--head-weight', C.theme.headWeight||700);
  if (C.navCta) $('[data-navcta]').textContent = C.navCta;
  document.title = `${C.name} — ${C.tagline}`;
  $('meta[name=description]').content = C.hero.subtitle;

  const waUrl = `https://wa.me/${C.whatsapp}?text=${encodeURIComponent(C.whatsappMsg)}`;
  $$('[data-wa]').forEach(a=>{a.href=waUrl;a.target='_blank';a.rel='noopener'});
  $$('[data-k]').forEach(el=>el.textContent=get(C,el.dataset.k)??'');
  $$('[data-html]').forEach(el=>el.innerHTML=get(C,el.dataset.html)??'');
  $('[data-logo]').innerHTML = C.logoHtml || esc(C.name);
  $('[data-nav-services]').textContent = C.services.navLabel || 'Serviços';
  $('[data-year]').textContent = new Date().getFullYear();
  $('#hero').style.backgroundImage = `url('${C.hero.image}')`;
  $('[data-credit]').innerHTML = C.credit || '';

  $('[data-badges]').innerHTML = C.hero.badges.map(b=>`<div><b>${esc(b[0])}</b>${esc(b[1])}</div>`).join('');
  $('[data-features]').innerHTML = C.features.items.map(f=>`<div class="card reveal"><div class="ico">${f.icon}</div><h3>${esc(f.title)}</h3><p>${esc(f.text)}</p></div>`).join('');

  // serviços com categorias
  const cats = C.services.categories;
  const renderSvcs = i => {
    $('[data-svcs]').innerHTML = cats[i].items.map(s=>`<div class="svc"><div><div class="n">${esc(s.name)}</div>${s.desc?`<div class="d">${esc(s.desc)}</div>`:''}</div><span class="dots"></span><span class="p">${esc(s.price)}</span></div>`).join('');
    $$('[data-cats] button').forEach((b,j)=>b.classList.toggle('on',i===j));
  };
  if (cats.length>1){
    $('[data-cats]').innerHTML = cats.map((c,i)=>`<button type="button">${esc(c.name)}</button>`).join('');
    $$('[data-cats] button').forEach((b,i)=>b.onclick=()=>renderSvcs(i));
  } else $('[data-cats]').style.display='none';
  renderSvcs(0);

  $('[data-gallery]').innerHTML = C.gallery.images.map(src=>`<figure class="reveal"><img loading="lazy" src="${esc(src)}" alt="${esc(C.name)}"></figure>`).join('');

  $('[data-gscore]').innerHTML = C.reviews.score ? `<span class="stars">★★★★★</span><b>${esc(C.reviews.score)}</b> no Google · ${esc(C.reviews.count)} avaliações` : '';
  if (C.reviews.link) $('[data-gscore]').innerHTML += ` · <a href="${esc(C.reviews.link)}" target="_blank" rel="noopener" style="color:var(--accent)">ver no Google →</a>`;
  if (!C.reviews.items.length) $('[data-reviews]').style.display='none';
  // faixa de prévia (para mostrar ao dono antes da venda)
  if (C.preview) {
    const b=document.createElement('div');
    b.style.cssText='position:fixed;left:12px;bottom:12px;right:92px;z-index:59;background:rgba(17,17,17,.92);color:#fff;font:500 .82rem/1.4 system-ui,sans-serif;padding:10px 14px;border-radius:12px;backdrop-filter:blur(6px);max-width:560px';
    b.innerHTML=C.preview+' <button aria-label="Fechar" style="background:none;border:0;color:#fff;opacity:.7;cursor:pointer;font-size:1rem;margin-left:6px">✕</button>';
    b.querySelector('button').onclick=()=>b.remove();
    document.body.appendChild(b);
  }
  $('[data-reviews]').innerHTML = C.reviews.items.map(v=>`<div class="card review reveal"><div class="stars">★★★★★</div><p>“${esc(v.text)}”</p><div class="who"><div class="av">${esc(v.name[0])}</div><div>${esc(v.name)}<small>${esc(v.meta||'')}</small></div></div></div>`).join('');

  const hours = C.contact.hours.map(h=>`<tr><td>${esc(h[0])}</td><td>${esc(h[1])}</td></tr>`).join('');
  $('[data-info]').innerHTML = `
    <div class="info-row"><div class="ico">📍</div><div><h4>Endereço</h4>${esc(C.contact.address)}</div></div>
    <div class="info-row"><div class="ico">📞</div><div><h4>Telefone / WhatsApp</h4>${esc(C.contact.phone)}</div></div>
    ${C.contact.instagram?`<div class="info-row"><div class="ico">📸</div><div><h4>Instagram</h4><a href="https://instagram.com/${esc(C.contact.instagram)}" target="_blank" rel="noopener">@${esc(C.contact.instagram)}</a></div></div>`:''}
    <div class="info-row"><div class="ico">🕒</div><div style="flex:1"><h4>Horário</h4><table class="hours">${hours}</table></div></div>
    <div><a class="btn" href="${waUrl}" target="_blank" rel="noopener">${esc(C.hero.cta)}</a></div>`;
  $('[data-map]').src = `https://www.google.com/maps?q=${encodeURIComponent(C.contact.mapQuery||C.contact.address)}&output=embed`;

  // header sólido ao rolar
  const hd=$('header'); const onS=()=>hd.classList.toggle('solid',scrollY>40); onS(); addEventListener('scroll',onS,{passive:true});
  // animação de entrada
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
  $$('.reveal').forEach(el=>io.observe(el));
})();
</script>
</body>
</html>
